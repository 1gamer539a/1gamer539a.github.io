// Générer numéro 16 chiffres depuis uid
function genCardNumber(uid){
  let hash=0;
  for(let i=0;i<uid.length;i++){hash=((hash<<5)-hash)+uid.charCodeAt(i);hash|=0;}
  const abs=Math.abs(hash);
  let n=String(abs).padStart(16,'4').slice(0,16);
  return n.replace(/(.{4})/g,'$1 ').trim();
}

// Générer date expiration (5 ans depuis inscription)
function genExpiry(since){
  const d=since?new Date(since):new Date();
  const year=(d.getFullYear()+5).toString().slice(-2);
  const month=String(d.getMonth()+1).padStart(2,'0');
  return month+'/'+year;
}

// Générer CVV depuis uid
function genCVV(uid){
  let h=0;
  for(let i=0;i<uid.length;i++){h=(h*31+uid.charCodeAt(i))%1000;}
  return String(h).padStart(3,'0');
}

      <div class="login-prompt">
        <div class="icon">💳</div>
        <h3>Connectez-vous pour accéder à votre GS VISA</h3>
        <p>Créez un compte ou connectez-vous pour activer votre carte et profiter de vos avantages exclusifs.</p>
        <a class="btn-login-prompt" href="compte.html">🔑 Se connecter</a>
      </div>`;
    return;
  }

  const snap=await get(ref(db,'users/'+user.uid));
  if(!snap.exists()){page.innerHTML='<div class="loading">Profil introuvable.</div>';return;}
  const u=snap.val();
  window.currentUserData=u;

  const orders=u.orders?Object.values(u.orders):[];
  const orderCount=orders.length;
  const level=getLevel(orderCount);
  const solde=u.gsvisaSolde||0;
  const hasStandard=u.gsvisaActive===true;
  const hasPremium=u.gscoinPremium===true;
  const isBlocked=u.gsvisaBloque===true;
  const isPending=u.gsvisaPending===true;
  const cardNum=hasStandard||hasPremium?genCardNumber(user.uid):'•••• •••• •••• ••••';
  const expiry=hasStandard||hasPremium?genExpiry(u.since):'••/••';
  const cvv=hasStandard||hasPremium?genCVV(user.uid):'•••';
  const history=u.gsvisaHistory?Object.values(u.gsvisaHistory).reverse().slice(0,8):[];

  const cardClass=isBlocked?'locked':(hasPremium?'premium':(hasStandard?'standard':'locked'));
  const logoSpanClass=hasPremium?'prm':'std';
  const networkClass=hasPremium?'prm':'std';
  const networkLabel=hasPremium?'PREMIUM':'STANDARD';
  const soldeColor=hasPremium?'prm':'std';

  page.innerHTML=`
    <!-- CARTE -->
    <div class="card-wrap">
      <div class="bank-card ${cardClass}">
        <div class="card-shimmer"></div>
        <div class="card-circle1"></div>
        <div class="card-circle2"></div>
        <div class="card-top">
          <div class="card-logo-gs">GS <span class="${logoSpanClass}">VISA</span></div>
          ${hasStandard||hasPremium?`<div class="card-network ${networkClass}">${networkLabel}</div>`:''}
        </div>
        <div class="card-chip"></div>
        <div class="card-number">${cardNum}</div>
        <div class="card-bottom">
          <div>
            <div class="card-holder-label">Titulaire</div>
            <div class="card-holder-name">${(u.name||'CLIENT').toUpperCase()}</div>
          </div>
          <div style="text-align:center">
            <div class="card-exp-label">Expiration</div>
            <div class="card-exp">${expiry}</div>
          </div>
          <div style="text-align:center">
            <div class="card-cvv-label">CVV</div>
            <div class="card-cvv">${cvv}</div>
          </div>
          <div class="card-solde-wrap">
            <div class="card-solde-label-small">Solde</div>
            <div class="card-solde-val ${soldeColor}">${solde.toLocaleString('fr-FR')} F</div>
          </div>
        </div>
        ${isBlocked?'<div class="lock-overlay"><div class="lock-icon">🚫</div><span class="lock-text">CARTE BLOQUÉE</span></div>':(!hasStandard&&!hasPremium?'<div class="lock-overlay"><div class="lock-icon">🔒</div><span class="lock-text">CARTE NON ACTIVÉE</span></div>':'')}
        ${isPending&&!hasStandard?'<div class="lock-overlay"><div class="lock-icon">⏳</div><span class="lock-text">EN ATTENTE D\'ACTIVATION</span></div>':''}
      </div>
    </div>

    <!-- STATS -->
    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-val blue">${solde.toLocaleString()}</div>
        <div class="stat-lbl">Solde FCFA</div>
      </div>
      <div class="stat-box">
        <div class="stat-val gold">${level.emoji} ${level.name}</div>
        <div class="stat-lbl">Niveau</div>
      </div>
      <div class="stat-box">
        <div class="stat-val green">${hasPremium?'25%':(hasStandard?level.cashback+'%':'—')}</div>
        <div class="stat-lbl">Cashback</div>
      </div>
    </div>

    <!-- ACTIVATION si pas encore de carte -->
    ${!hasStandard&&!hasPremium&&!isPending?`
    <div class="sec-title">Choisissez votre carte</div>
    <div class="activation-grid">
      <div class="act-card std-card">
        <div class="act-card-icon">💳</div>
        <div class="act-card-name">GS VISA Standard</div>
        <div class="act-card-price blue">750 FCFA</div>
        <div class="act-card-perks">
          <span>✅ Cashback 0.3%→1.5%</span>
          <span>✅ Carte 16 chiffres</span>
          <span>✅ Paiement unique</span>
        </div>
        <button class="btn-activate blue" onclick="openActivation('standard')">Activer</button>
      </div>
      <div class="act-card prm-card">
        <div class="act-card-icon">⭐</div>
        <div class="act-card-name">GS COIN Premium</div>
        <div class="act-card-price gold">2 500 FCFA</div>
        <div class="act-card-perks">
          <span>⭐ -25% sur tout</span>
          <span>✅ Carte dorée</span>
          <span>✅ Paiement unique</span>
        </div>
        <button class="btn-activate gold" onclick="openActivation('premium')">Activer</button>
      </div>
    </div>`:
    isPending&&!hasStandard?`
    <div style="background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);border-radius:10px;padding:1rem;text-align:center;margin-bottom:1.2rem">
      <div style="font-size:1.5rem;margin-bottom:.3rem">⏳</div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;color:var(--gold)">Activation en cours</div>
      <div style="font-size:.75rem;color:var(--muted);margin-top:.3rem">Votre paiement est en cours de vérification. Votre carte sera activée sous peu.</div>
    </div>`:
    hasStandard&&!hasPremium?`
    <div class="activation-grid" style="grid-template-columns:1fr">
      <div class="act-card prm-card">
        <div class="act-card-icon">⭐</div>
        <div class="act-card-name">Passer au Premium</div>
        <div class="act-card-price gold">2 500 FCFA</div>
        <div class="act-card-perks"><span>⭐ 25% de réduction sur tout</span><span>✅ Remplace votre carte Standard</span></div>
        <button class="btn-activate gold" onclick="openActivation('premium')">Upgrader</button>
      </div>
    </div>`:''}

    <!-- RECHARGE (si carte active) -->
    ${(hasStandard||hasPremium)&&!isBlocked?`
    <div class="recharge-section">
      <div class="sec-title">💰 Recharger ma carte</div>
      <div style="font-size:.78rem;color:var(--muted);margin-bottom:.5rem">Choisissez un montant ou entrez un montant personnalisé (min. 250 FCFA)</div>
      <div class="recharge-amounts">
        ${RECHARGE_AMOUNTS.map(a=>`<button class="amt-btn ${hasPremium?'':''}'" data-amt="${a}" onclick="selectAmount(${a},${hasPremium})">${a.toLocaleString()} F</button>`).join('')}
      </div>
      <input class="custom-input" id="custom-amount" type="number" placeholder="Montant personnalisé..." min="250" oninput="selectedRecharge=0;document.querySelectorAll('.amt-btn').forEach(b=>b.classList.remove('selected'))">
      <button class="btn-recharge ${hasPremium?'gold':'blue'}" onclick="rechargeCard()">💳 Recharger via Sebpay</button>
    </div>`:isBlocked?`
    <div style="background:rgba(224,32,32,.08);border:1px solid rgba(224,32,32,.2);border-radius:10px;padding:1rem;text-align:center;margin-bottom:1.2rem">
      <div style="font-size:1.5rem;margin-bottom:.3rem">🚫</div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;color:var(--red)">Carte bloquée</div>
      <div style="font-size:.75rem;color:var(--muted);margin-top:.3rem">Contactez le support pour débloquer votre carte.</div>
    </div>`:''}

    <!-- NIVEAUX cashback -->
    ${hasStandard&&!hasPremium?`
    <div class="levels-section">
      <div class="sec-title">Niveaux de cashback</div>
      ${LEVELS.map(l=>`
        <div class="level-row ${level.name===l.name?'current':''}">
          <div class="level-badge" style="background:${l.color}22;color:${l.color}">${l.emoji}</div>
          <div class="level-info">
            <div class="level-name" style="color:${l.color}">${l.name}</div>
            <div class="level-req">${l.max===Infinity?l.min+' commandes +':l.min+'-'+l.max+' commandes'}</div>
          </div>
          <div class="level-cashback">${l.cashback}%</div>
        </div>`).join('')}
    </div>`:''}

    <!-- HISTORIQUE -->
    <div>
      <div class="sec-title">Historique des transactions</div>
      ${history.length?history.map(h=>`
        <div class="hist-item">
          <div class="hist-icon ${h.type==='credit'?'credit':'debit'}">${h.type==='credit'?'↑':'↓'}</div>
          <div class="hist-info">
            <div class="hist-label">${h.label||'Transaction'}</div>
            <div class="hist-date">${h.date||''}</div>
          </div>
          <div class="hist-amount ${h.type==='credit'?'credit':'debit'}">${h.type==='credit'?'+':'−'}${h.amount.toLocaleString()} F</div>
        </div>`).join(''):
        '<div style="text-align:center;padding:2rem;color:var(--muted);font-size:.82rem">📭 Aucune transaction pour le moment.</div>'}
    </div>`;
});
</script>
</body>
</html>
