<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — GAMER-SHOP</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[data-theme="dark"]{--red:#e02020;--red-dark:#b01515;--green:#25d366;--blue:#38bdf8;--orange:#ff8c00;--gold:#f59e0b;--bg:#0a0a0f;--bg2:#0f0f18;--bg3:#13131f;--card:#111118;--card2:#16161f;--border:#1e1e2e;--border2:#252535;--text:#f0f4ff;--muted:#6b7280;--muted2:#374151}
body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh;padding-bottom:3rem}

/* LOGIN */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1.5rem}
.login-box{background:var(--card2);border:1px solid var(--border2);border-radius:14px;padding:2rem 2.2rem;width:100%;max-width:380px;text-align:center;animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.login-icon{width:60px;height:60px;background:var(--red);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto 1rem}
.login-box h2{font-family:'Barlow Condensed',sans-serif;font-size:1.3rem;font-weight:800;letter-spacing:1px;margin-bottom:.2rem}
.login-box p{font-size:.75rem;color:var(--muted);margin-bottom:1.5rem}
.login-box input{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:7px;padding:.65rem .9rem;color:#fff;font-family:'Barlow',sans-serif;font-size:.9rem;outline:none;text-align:center;margin-bottom:.8rem;transition:border .2s}
.login-box input:focus{border-color:var(--red)}
.login-box input::placeholder{color:#444}
.btn-login{width:100%;padding:.65rem;border-radius:7px;border:none;cursor:pointer;background:var(--red);color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:.95rem;font-weight:700;letter-spacing:.6px;transition:all .2s}
.btn-login:hover{background:var(--red-dark)}
.login-error{background:rgba(224,32,32,.1);border:1px solid rgba(224,32,32,.25);border-radius:6px;padding:.5rem;font-size:.76rem;color:#e05050;margin-bottom:.8rem;display:none;font-family:'Barlow Condensed',sans-serif;font-weight:600}
.login-error.show{display:block}

/* ADMIN SCREEN */
#admin-screen{display:none}
#section-screen{display:none}

/* HEADER */
.admin-header{background:#0d0d0d;border-bottom:2px solid var(--border2);padding:0 1.2rem;display:flex;align-items:center;height:58px;gap:.8rem;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(0,0,0,.7)}
.admin-logo{display:flex;align-items:center;gap:.5rem;flex:1}
.admin-logo-icon{width:34px;height:34px;background:var(--red);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1rem}
.admin-logo-text{font-family:'Rajdhani',sans-serif;font-size:1.1rem;font-weight:700;letter-spacing:1px}
.admin-logo-text span{color:var(--red)}
.admin-badge{background:rgba(224,32,32,.15);border:1px solid rgba(224,32,32,.3);color:var(--red);font-size:.62rem;font-family:'Barlow Condensed',sans-serif;font-weight:700;padding:.1rem .4rem;border-radius:4px;letter-spacing:.5px}
.admin-time{font-size:.72rem;color:var(--muted);font-family:'Barlow Condensed',sans-serif}
.btn-logout{padding:.35rem .8rem;border-radius:6px;border:1px solid var(--border2);background:transparent;color:var(--muted);cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:.78rem;font-weight:600;transition:all .2s}
.btn-logout:hover{color:#fff;background:var(--bg3)}
.btn-back-menu{display:flex;align-items:center;gap:.3rem;background:var(--red);color:#fff;border:none;border-radius:8px;padding:.35rem .75rem;font-family:'Barlow Condensed',sans-serif;font-size:.82rem;font-weight:700;cursor:pointer;transition:all .2s}

/* STATS */
.admin-home{max-width:520px;margin:0 auto;padding:1.2rem 1rem}
.admin-stats{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-bottom:1.4rem}
.as-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem 1.1rem;display:flex;align-items:center;gap:.85rem}
.as-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.asi-blue{background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.2)}
.asi-orange{background:rgba(255,140,0,.12);border:1px solid rgba(255,140,0,.2)}
.asi-green{background:rgba(37,211,102,.1);border:1px solid rgba(37,211,102,.18)}
.asi-red{background:rgba(224,32,32,.1);border:1px solid rgba(224,32,32,.18)}
.as-val{font-family:'Rajdhani',sans-serif;font-size:1.6rem;font-weight:700;line-height:1}
.as-label{font-size:.68rem;color:var(--muted);margin-top:.08rem}

/* MENU ITEMS (style index.html) */
.menu-sep{display:flex;align-items:center;gap:.6rem;margin-bottom:.5rem}
.menu-sep span{font-family:'Barlow Condensed',sans-serif;font-size:.65rem;font-weight:700;letter-spacing:2px;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.menu-sep::before,.menu-sep::after{content:'';flex:1;height:1px;background:var(--border)}
.menu-item{display:flex;align-items:center;gap:1rem;padding:1rem 1.2rem;background:var(--card);border:1px solid var(--border);border-radius:14px;cursor:pointer;color:var(--text);transition:all .22s;margin-bottom:.55rem;width:100%;text-align:left}
.menu-item:hover{border-color:var(--red);transform:translateX(4px)}
.menu-item:active{transform:scale(.97)}
.menu-icon{width:46px;height:46px;background:var(--bg3);border:1px solid var(--border2);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0;transition:all .2s}
.menu-item:hover .menu-icon{background:var(--red);border-color:var(--red)}
.menu-text{flex:1}
.menu-label{font-family:'Barlow Condensed',sans-serif;font-size:1rem;font-weight:800;letter-spacing:.8px;text-transform:uppercase;display:block;margin-bottom:.08rem}
.menu-desc{font-size:.74rem;color:var(--muted);line-height:1.4}
.menu-arrow{font-size:1.1rem;color:var(--muted);transition:all .2s;flex-shrink:0}
.menu-item:hover .menu-arrow{transform:translateX(4px);color:var(--red)}
.menu-badge-count{background:var(--red);color:#fff;font-size:.65rem;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;padding:0 4px;font-family:'Barlow Condensed',sans-serif}

/* SECTION CONTENT */
.section-content{max-width:680px;margin:0 auto;padding:1.2rem 1rem}
.section-title-bar{display:flex;align-items:center;gap:.6rem;margin-bottom:1rem}
.section-title-bar h2{font-family:'Barlow Condensed',sans-serif;font-size:1.1rem;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;flex:1}

/* Orders */
.filters-bar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.8rem}
.filter-btn{padding:.38rem .85rem;border-radius:6px;border:1px solid var(--border2);background:transparent;color:var(--muted);cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:.8rem;font-weight:600;transition:all .2s}
.filter-btn.active{background:var(--red);color:#fff;border-color:var(--red)}
.search-input{background:var(--bg3);border:1px solid var(--border2);border-radius:6px;padding:.38rem .8rem;color:#fff;font-family:'Barlow',sans-serif;font-size:.8rem;outline:none;width:100%;transition:border .2s;margin-bottom:.8rem}
.search-input:focus{border-color:var(--blue)}
.search-input::placeholder{color:#444}
.order-admin-row{display:flex;align-items:center;gap:.8rem;padding:.85rem 1rem;border:1px solid var(--border);border-radius:10px;margin-bottom:.5rem;background:var(--card);transition:background .2s}
.oar-client{flex:1;min-width:0}
.oar-name{font-family:'Barlow Condensed',sans-serif;font-size:.88rem;font-weight:700;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oar-client-badge{font-size:.62rem;color:var(--blue);font-family:'Barlow Condensed',sans-serif;font-weight:600}
.oar-price{font-family:'Barlow Condensed',sans-serif;font-size:.88rem;font-weight:700;color:var(--red);white-space:nowrap;flex-shrink:0}
.oar-date{font-size:.68rem;color:var(--muted);white-space:nowrap;flex-shrink:0}
.status-select{background:var(--bg3);border:1px solid var(--border2);border-radius:5px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:.75rem;font-weight:600;padding:.25rem .4rem;cursor:pointer;outline:none;flex-shrink:0}
.status-select.delivered{border-color:rgba(37,211,102,.4);color:#25d366;background:rgba(37,211,102,.08)}
.status-select.pending{border-color:rgba(255,140,0,.4);color:#ff8c00;background:rgba(255,140,0,.08)}
.status-select.cancelled{border-color:rgba(224,32,32,.3);color:#e05050;background:rgba(224,32,32,.06)}

/* Clients */
.client-row{display:flex;align-items:center;gap:.9rem;padding:.8rem 1rem;border:1px solid var(--border);border-radius:10px;margin-bottom:.5rem;background:var(--card)}
.client-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#1a3a5a,#2a5a8a);display:flex;align-items:center;justify-content:center;font-size:1rem;border:1.5px solid var(--blue);flex-shrink:0;overflow:hidden}
.client-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.client-info{flex:1;min-width:0}
.client-name{font-family:'Barlow Condensed',sans-serif;font-size:.88rem;font-weight:700;display:flex;align-items:center;gap:.4rem}
.client-email{font-size:.68rem;color:var(--muted)}
.client-stats{display:flex;gap:.8rem;margin-left:auto;text-align:right;flex-shrink:0}
.cstat{font-family:'Barlow Condensed',sans-serif;font-size:.8rem;font-weight:600}
.cstat-label{font-size:.62rem;color:var(--muted)}
.vip-mini{background:linear-gradient(135deg,#b8860b,#ffd700);color:#000;font-size:.55rem;font-weight:700;padding:.08rem .35rem;border-radius:3px;letter-spacing:.4px}

/* Promo */
.promo-row-admin{display:flex;align-items:center;gap:.8rem;padding:.8rem 1rem;border:1px solid var(--border);border-radius:10px;margin-bottom:.5rem;background:var(--card)}
.promo-code-badge{background:rgba(37,211,102,.12);border:1px solid rgba(37,211,102,.22);color:#25d366;font-family:'Barlow Condensed',sans-serif;font-size:.85rem;font-weight:800;padding:.2rem .6rem;border-radius:5px;letter-spacing:1px;flex-shrink:0}
.promo-info{flex:1}
.promo-type{font-size:.75rem;color:var(--muted);font-family:'Barlow Condensed',sans-serif}
.promo-uses{font-size:.72rem;color:var(--muted2)}
.btn-toggle{padding:.3rem .7rem;border-radius:5px;border:none;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:.72rem;font-weight:700;transition:all .2s}
.btn-toggle.on{background:rgba(37,211,102,.15);color:#25d366;border:1px solid rgba(37,211,102,.3)}
.btn-toggle.off{background:rgba(224,32,32,.1);color:#e05050;border:1px solid rgba(224,32,32,.2)}
.btn-del-promo{padding:.3rem .7rem;border-radius:5px;border:1px solid rgba(224,32,32,.2);background:transparent;color:#e05050;cursor:pointer;font-size:.72rem;font-weight:700}
.promo-form{background:var(--bg3);border-radius:10px;padding:1rem;margin-bottom:.8rem;display:flex;flex-direction:column;gap:.6rem}
.promo-form input,.promo-form select{background:var(--bg2);border:1px solid var(--border2);border-radius:6px;padding:.45rem .7rem;color:#fff;font-family:'Barlow',sans-serif;font-size:.8rem;outline:none;width:100%}
.promo-form input::placeholder{color:#444}
.btn-add-promo{padding:.5rem;border-radius:6px;border:none;cursor:pointer;background:#25d366;color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:.85rem;font-weight:700;width:100%}

/* Form général */
.admin-form{background:var(--bg3);border-radius:10px;padding:1rem;margin-bottom:.8rem;display:flex;flex-direction:column;gap:.6rem}
.admin-form input,.admin-form select,.admin-form textarea{background:var(--bg2);border:1px solid var(--border2);border-radius:6px;padding:.5rem .7rem;color:#fff;font-family:'Barlow',sans-serif;font-size:.84rem;outline:none;width:100%;transition:border .2s}
.admin-form input:focus,.admin-form select:focus,.admin-form textarea:focus{border-color:var(--red)}
.admin-form input::placeholder,.admin-form textarea::placeholder{color:#444}
.admin-form label{font-family:'Barlow Condensed',sans-serif;font-size:.7rem;font-weight:700;color:var(--muted);letter-spacing:.8px;text-transform:uppercase}
.btn-admin-action{padding:.55rem;border-radius:8px;border:none;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:.88rem;font-weight:800;width:100%;transition:all .2s}
.btn-admin-action.red{background:var(--red);color:#fff}
.btn-admin-action.green{background:#25d366;color:#fff}
.btn-admin-action.blue{background:var(--blue);color:#000}

.empty-admin{text-align:center;padding:2rem;color:var(--muted);font-size:.82rem}
.empty-admin .ei{font-size:2.5rem;margin-bottom:.5rem}

/* Toast */
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(16px);background:var(--card2);border:1px solid var(--border2);border-radius:8px;padding:.65rem 1.1rem;font-family:'Barlow Condensed',sans-serif;font-size:.85rem;font-weight:600;z-index:999;opacity:0;pointer-events:none;transition:all .3s;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{border-color:#25d366;color:#25d366}
.toast.info{border-color:var(--blue);color:var(--blue)}
.toast.error{border-color:var(--red);color:#e05050}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-icon">⚙️</div>
    <h2>PANNEAU ADMIN</h2>
    <p>Accès réservé — GAMER-SHOP</p>
    <div class="login-error" id="login-error">❌ Identifiants incorrects</div>
    <input type="email" id="admin-email" placeholder="Email admin" style="margin-bottom:.6rem">
    <input type="password" id="admin-pass" placeholder="Mot de passe" onkeydown="if(event.key==='Enter'&&window.checkPass)window.checkPass()">
    <button class="btn-login" onclick="if(window.checkPass)window.checkPass()">🔐 Accéder au panneau</button>
  </div>
</div>

<!-- ADMIN HOME (menu principal) -->
<div id="admin-screen">
  <div class="admin-header">
    <div class="admin-logo">
      <div class="admin-logo-icon">⚙️</div>
      <div class="admin-logo-text">GAMER<span>-SHOP</span></div>
      <div class="admin-badge">ADMIN</div>
    </div>
    <div class="admin-time" id="admin-time"></div>
    <button class="btn-logout" onclick="adminLogout()">Déconnexion</button>
  </div>

  <div class="admin-home">
    <div class="admin-stats" id="admin-stats"></div>

    <div class="menu-sep"><span>Gestion</span></div>

    <button class="menu-item" onclick="openSection('orders')">
      <div class="menu-icon">📦</div>
      <div class="menu-text">
        <span class="menu-label">Commandes</span>
        <span class="menu-desc">Gérer et mettre à jour les commandes</span>
      </div>
      <span class="menu-badge-count" id="badge-orders">0</span>
      <span class="menu-arrow">›</span>
    </button>

    <button class="menu-item" onclick="openSection('clients')">
      <div class="menu-icon">👥</div>
      <div class="menu-text">
        <span class="menu-label">Clients</span>
        <span class="menu-desc">Liste et profils des clients</span>
      </div>
      <span class="menu-arrow">›</span>
    </button>

    <button class="menu-item" onclick="openSection('gsvisa')">
      <div class="menu-icon">💳</div>
      <div class="menu-text">
        <span class="menu-label">GS VISA</span>
        <span class="menu-desc">Activer, recharger et gérer les cartes</span>
      </div>
      <span class="menu-badge-count" id="badge-gsvisa" style="background:var(--gold)">0</span>
      <span class="menu-arrow">›</span>
    </button>

    <div class="menu-sep"><span>Configuration</span></div>

    <button class="menu-item" onclick="openSection('promos')">
      <div class="menu-icon">🎟</div>
      <div class="menu-text">
        <span class="menu-label">Codes Promo</span>
        <span class="menu-desc">Créer et gérer les codes de réduction</span>
      </div>
      <span class="menu-arrow">›</span>
    </button>

    <button class="menu-item" onclick="openSection('banniere')">
      <div class="menu-icon">📢</div>
      <div class="menu-text">
        <span class="menu-label">Bannière</span>
        <span class="menu-desc">Message promotionnel en haut du site</span>
      </div>
      <span class="menu-arrow">›</span>
    </button>

    <button class="menu-item" onclick="openSection('groupes')">
      <div class="menu-icon">🌐</div>
      <div class="menu-text">
        <span class="menu-label">Réseaux Sociaux</span>
        <span class="menu-desc">Gérer les liens des réseaux sociaux</span>
      </div>
      <span class="menu-arrow">›</span>
    </button>

    <button class="menu-item" onclick="openSection('avis')">
      <div class="menu-icon">⭐</div>
      <div class="menu-text">
        <span class="menu-label">Avis Clients</span>
        <span class="menu-desc">Valider et modérer les avis</span>
      </div>
      <span class="menu-badge-count" id="badge-avis">0</span>
      <span class="menu-arrow">›</span>
    </button>
  </div>
</div>

<!-- SECTION SCREEN -->
<div id="section-screen">
  <div class="admin-header">
    <button class="btn-back-menu" onclick="closeSection()"><span>←</span> Menu</button>
    <div class="admin-logo" style="justify-content:center">
      <div class="admin-logo-text" id="section-title-header">GAMER<span>-SHOP</span></div>
    </div>
    <div class="admin-time" id="admin-time2"></div>
  </div>
  <div class="section-content" id="section-content"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get, set, update, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const ADMIN_UID = 'czbKuRTt2fW8SaW0FAZI6GjqSay2';
const SEBPAY_URL = 'https://new.sebpay.bj/pay/gamer-shop-eyzqFU';

const firebaseConfig = {
  apiKey:"AIzaSyAdWC5zTUJGmrXDCnRcElomHHgcVPG-2Co",
  authDomain:"shop-stor-1d943.firebaseapp.com",
  databaseURL:"https://shop-stor-1d943-default-rtdb.firebaseio.com",
  projectId:"shop-stor-1d943",
  storageBucket:"shop-stor-1d943.firebasestorage.app",
  messagingSenderId:"851885624502",
  appId:"1:851885624502:web:16bb29dd0494d34a846a17"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

onAuthStateChanged(auth, (user) => {
  if(user && user.uid === ADMIN_UID){
    document.getElementById('login-screen').style.display='none';
    document.getElementById('admin-screen').style.display='block';
    startLiveData();
  } else if(user){ signOut(auth); }
});

let allUsersData = {};
let allPromos = {};

// CLOCK
setInterval(()=>{
  const t = new Date().toLocaleTimeString('fr-FR');
  ['admin-time','admin-time2'].forEach(id=>{ const el=document.getElementById(id); if(el) el.textContent=t; });
},1000);

// LOGIN
window.checkPass = async function(){
  const email = document.getElementById('admin-email').value.trim();
  const pass = document.getElementById('admin-pass').value;
  if(!email||!pass) return;
  try {
    const cred = await signInWithEmailAndPassword(auth, email, pass);
    if(cred.user.uid !== ADMIN_UID){ await signOut(auth); document.getElementById('login-error').textContent='❌ Accès non autorisé.'; document.getElementById('login-error').classList.add('show'); return; }
  } catch(e){
    let msg = '❌ Email ou mot de passe incorrect.';
    if(e.code==='auth/too-many-requests') msg='🔒 Trop de tentatives. Réessayez plus tard.';
    document.getElementById('login-error').textContent=msg; document.getElementById('login-error').classList.add('show');
    document.getElementById('admin-pass').value='';
  }
};

window.adminLogout = async function(){ await signOut(auth); document.getElementById('admin-screen').style.display='none'; document.getElementById('section-screen').style.display='none'; document.getElementById('login-screen').style.display='flex'; };

// LIVE DATA
function startLiveData(){
  onValue(ref(db,'users'), snap=>{ allUsersData=snap.exists()?snap.val():{}; updateStats(); });
  onValue(ref(db,'promoCodes'), snap=>{ allPromos=snap.exists()?snap.val():{}; });
  onValue(ref(db,'avis'), snap=>{
    let pending=0;
    if(snap.exists()) snap.forEach(c=>{ if(c.val().statut==='en attente') pending++; });
    const b=document.getElementById('badge-avis'); if(b) b.textContent=pending;
  });
}

function getAllOrders(){
  const result=[];
  Object.entries(allUsersData).forEach(([key,user])=>{
    const orders=user.orders?Object.values(user.orders):[];
    orders.forEach((o,idx)=>result.push({...o,clientName:user.name,clientEmail:user.email,clientId:user.id,userKey:key,orderIdx:idx}));
  });
  return result.sort((a,b)=>new Date(b.date)-new Date(a.date));
}

function updateStats(){
  const allOrders=getAllOrders();
  const pending=allOrders.filter(o=>o.status==='pending').length;

let currentFilter='all';

  const allOrders=getAllOrders();
  const pending=allOrders.filter(o=>o.status==='pending').length;
  const delivered=allOrders.filter(o=>o.status==='delivered').length;

  c.innerHTML=`
    <div class="filters-bar">
      <button class="filter-btn ${currentFilter==='all'?'active':''}" onclick="filterOrders('all',this)">Tout (${allOrders.length})</button>

      <button class="filter-btn ${currentFilter==='delivered'?'active':''}" onclick="filterOrders('delivered',this)">✅ Livrés (${delivered})</button>

  if(!list) return;

        <div class="oar-client-badge">👤 ${o.clientName} · ${o.clientId||''}</div>

        ${o.pays?`<div style="font-size:.63rem;color:var(--muted);font-family:'Barlow Condensed',sans-serif">🌍 ${o.pays} · 💳 ${o.paiement||'—'}</div>`:''}

window.filterOrders = function(f,btn){
  currentFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  window.renderOrdersList();
};

window.updateStatus = async function(userKey,idx,selectEl){
  const newStatus=selectEl.value;
  const user=allUsersData[userKey];
  if(!user) return;
  const orders=user.orders?Object.values(user.orders):[];
  if(!orders[idx]) return;
  orders[idx].status=newStatus;
  await update(ref(db,'users/'+userKey),{orders});
  selectEl.className='status-select '+newStatus;
  if(newStatus==='delivered'||newStatus==='cancelled') await sendNotification(userKey,orders[idx].name,newStatus);
  showToast('✅ Statut mis à jour','success');
};

function renderGsvisaList(){
  const list=document.getElementById('gsvisa-admin-list');
  if(!list) return;
  const f=window._gsvisaFilter||'all';
  let data=Object.entries(allUsersData);
  if(f==='pending') data=data.filter(([,u])=>u.gsvisaPending);
  else if(f==='active') data=data.filter(([,u])=>u.gsvisaActive&&!u.gscoinPremium&&!u.gsvisaBloque);
  else if(f==='premium') data=data.filter(([,u])=>u.gscoinPremium&&!u.gsvisaBloque);
  else if(f==='blocked') data=data.filter(([,u])=>u.gsvisaBloque);

  if(!data.length){ list.innerHTML='<div class="empty-admin"><div class="ei">💳</div>Aucune carte dans cette catégorie</div>'; return; }

  list.innerHTML=data.map(([uid,u])=>{
    const isPending=u.gsvisaPending;
    const isBlocked=u.gsvisaBloque;
    const hasPremium=u.gscoinPremium;
    const hasStandard=u.gsvisaActive;
    const solde=u.gsvisaSolde||0;
    const cardNum=u.gsvisaCardNumber||'—';

    let badge='<span style="font-size:.7rem;padding:.2rem .5rem;border-radius:4px;background:#333;color:#aaa">Aucune carte</span>';
    if(isBlocked) badge='<span style="font-size:.7rem;padding:.2rem .5rem;border-radius:4px;background:#e0202033;color:#e02020">🚫 Bloquée</span>';
    else if(isPending) badge='<span style="font-size:.7rem;padding:.2rem .5rem;border-radius:4px;background:#f59e0b33;color:#f59e0b">⏳ En attente</span>';
    else if(hasPremium) badge='<span style="font-size:.7rem;padding:.2rem .5rem;border-radius:4px;background:#f59e0b33;color:#f59e0b">⭐ Premium</span>';
    else if(hasStandard) badge='<span style="font-size:.7rem;padding:.2rem .5rem;border-radius:4px;background:#38bdf833;color:#38bdf8">💳 Standard</span>';

    return`<div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.9rem;margin-bottom:.55rem">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.4rem">
        <div>
          <div style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.9rem">${u.name||'—'}</div>
          <div style="font-size:.68rem;color:#555">${u.email||uid}</div>
        </div>
        ${badge}
      </div>
      <div style="display:flex;gap:.8rem;font-size:.72rem;color:#777;margin-bottom:.6rem">
        <span>💰 Solde: <strong style="color:var(--blue)">${solde.toLocaleString()} FCFA</strong></span>
        <span>🃏 ${cardNum}</span>
      </div>
      <div style="display:flex;gap:.4rem;flex-wrap:wrap">
        ${isPending?`<button onclick="window.activateGsvisa('${uid}')" style="background:#38bdf8;color:#000;border:none;padding:.35rem .7rem;border-radius:6px;cursor:pointer;font-size:.72rem;font-weight:700">✅ Activer carte</button>`:''}
        ${(hasStandard||hasPremium)&&!isBlocked?`<button onclick="window.rechargeGsvisa('${uid}','${u.name||''}')" style="background:#25d366;color:#fff;border:none;padding:.35rem .7rem;border-radius:6px;cursor:pointer;font-size:.72rem;font-weight:700">💰 Recharger</button>`:''}
        ${!hasPremium&&!isBlocked&&(hasStandard||isPending)?`<button onclick="window.setGsvisaPremium('${uid}')" style="background:#f59e0b;color:#000;border:none;padding:.35rem .7rem;border-radius:6px;cursor:pointer;font-size:.72rem;font-weight:700">⭐ Activer Premium</button>`:''}
        ${(hasStandard||hasPremium)&&!isBlocked?`<button onclick="window.setGsvisaBloque('${uid}',true)" style="background:#e02020;color:#fff;border:none;padding:.35rem .7rem;border-radius:6px;cursor:pointer;font-size:.72rem;font-weight:700">🚫 Bloquer</button>`:''}
        ${isBlocked?`<button onclick="window.setGsvisaBloque('${uid}',false)" style="background:#25d366;color:#fff;border:none;padding:.35rem .7rem;border-radius:6px;cursor:pointer;font-size:.72rem;font-weight:700">🔓 Débloquer</button>`:''}
      </div>
    </div>`;
  }).join('');
}

window.activateGsvisa = async function(uid){
  await update(ref(db,'users/'+uid),{gsvisaActive:true,gsvisaPending:false,gsvisaBloque:false});
  allUsersData[uid]={...allUsersData[uid],gsvisaActive:true,gsvisaPending:false};
  renderGsvisaList(); showToast('✅ Carte GS VISA activée','success');
};

window.setGsvisaPremium = async function(uid){
  await update(ref(db,'users/'+uid),{gscoinPremium:true,gsvisaActive:true,gsvisaPending:false,gsvisaBloque:false});
  allUsersData[uid]={...allUsersData[uid],gscoinPremium:true,gsvisaActive:true};
  renderGsvisaList(); showToast('⭐ Carte Premium activée','success');
};

window.setGsvisaBloque = async function(uid,bloque){
  await update(ref(db,'users/'+uid),{gsvisaBloque:bloque});
  allUsersData[uid]={...allUsersData[uid],gsvisaBloque:bloque};
  renderGsvisaList(); showToast(bloque?'🚫 Carte bloquée':'🔓 Carte débloquée','info');
};

window.rechargeGsvisa = async function(uid, nom){
  const montant = prompt('Montant à recharger (FCFA) pour '+nom+' :');
  if(!montant || isNaN(parseInt(montant))) return;
  const m = parseInt(montant);
  const currentSolde = allUsersData[uid]?.gsvisaSolde||0;
  const newSolde = currentSolde + m;
  const histKey = 'r_'+Date.now();
  const updates = { gsvisaSolde: newSolde };
  updates['gsvisaHistory/'+histKey] = {type:'credit',amount:m,label:'Recharge admin',date:new Date().toLocaleString('fr-FR')};
  await update(ref(db,'users/'+uid), updates);
  allUsersData[uid]={...allUsersData[uid],gsvisaSolde:newSolde};
  renderGsvisaList(); showToast('💰 '+m.toLocaleString()+' FCFA rechargés','success');
};

window.addPromo = async function(){
  const code=document.getElementById('new-promo-code').value.trim().toUpperCase();
  const type=document.getElementById('new-promo-type').value;
  const value=parseInt(document.getElementById('new-promo-value').value);

  await set(ref(db,'promoCodes/'+code),{code,type,value,active:true,uses:0});
  document.getElementById('new-promo-code').value='';
  document.getElementById('new-promo-value').value='';
  showToast('✅ Code "'+code+'" créé !','success');
  renderSection('promos');
};

window.togglePromo = async function(code,current){
  await update(ref(db,'promoCodes/'+code),{active:!current});
  showToast('✅ Code mis à jour','success');
};

window.deletePromo = async function(code){
  if(!confirm('Supprimer le code "'+code+'" ?')) return;
  await set(ref(db,'promoCodes/'+code),null);
  showToast('🗑 Code supprimé','info');
};

window.saveBanniere = async function(actif){
  const texte=document.getElementById('ban-texte')?.value.trim();
  const couleur=document.getElementById('ban-couleur')?.value;
  const textColor=document.getElementById('ban-textcolor')?.value;
  const timerEnd=document.getElementById('ban-timer-end')?.value;
  if(actif&&!texte){ showToast('⚠️ Entrez un texte','error'); return; }
  await set(ref(db,'banniere'),{actif,texte,couleur,textColor,timer:!!timerEnd,timerEnd:timerEnd||null});
  showToast(actif?'✅ Bannière activée !':'⛔ Bannière désactivée');
};

        <option value="tiktok">TikTok</option><option value="youtube">YouTube</option>
        <option value="telegram">Telegram</option><option value="whatsapp">WhatsApp</option>
        <option value="twitter">Twitter/X</option><option value="snapchat">Snapchat</option>
        <option value="discord">Discord</option><option value="default">Autre</option>
      </select>
      <label>Handle (@)</label><input id="g-handle" placeholder="@gamershop">
      <label>Lien</label><input id="g-lien" placeholder="https://...">
      <button class="btn-admin-action green" onclick="window.addGroupe()">➕ Ajouter</button>
    </div>
    <div id="groupes-admin-list"><div style="color:#aaa;font-size:.8rem;text-align:center;padding:1rem">Chargement...</div></div>`;
  onValue(ref(db,'reseaux_sociaux'),snap=>{
    const list=document.getElementById('groupes-admin-list'); if(!list) return;
    if(!snap.exists()){ list.innerHTML='<div class="empty-admin"><div class="ei">🌐</div>Aucun réseau</div>'; return; }
    const entries=Object.entries(snap.val());
    list.innerHTML=entries.map(([k,g])=>`
      <div style="display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.75rem 1rem;margin-bottom:.5rem;gap:.5rem">
        <div>
          <div style="color:#fff;font-weight:700;font-size:.85rem">${SOCIAL_ICONS[g.type]||SOCIAL_ICONS.default} ${g.nom}${g.actif===false?' <span style="color:#e02020;font-size:.68rem">(masqué)</span>':''}</div>
          ${g.handle?`<div style="color:#aaa;font-size:.72rem">${g.handle}</div>`:''}
          <div style="color:#25d366;font-size:.72rem;word-break:break-all">${g.lien}</div>
        </div>
        <div style="display:flex;gap:.4rem;flex-shrink:0">
          <button onclick="window.toggleGroupe('${k}',${g.actif===false})" style="background:#333;color:#fff;border:none;padding:.4rem .6rem;border-radius:6px;cursor:pointer;font-size:.75rem">${g.actif===false?'👁️':'🙈'}</button>
          <button onclick="window.deleteGroupe('${k}')" style="background:#e02020;color:#fff;border:none;padding:.4rem .7rem;border-radius:6px;cursor:pointer;font-size:.75rem">🗑️</button>
        </div>
      </div>`).join('');
  });
}

window.addGroupe = async function(){
  const nom=document.getElementById('g-nom').value.trim();
  const type=document.getElementById('g-type').value;
  const handle=document.getElementById('g-handle').value.trim();
  const lien=document.getElementById('g-lien').value.trim();
  if(!nom||!lien){ showToast('⚠️ Remplissez le nom et le lien','error'); return; }
  await set(ref(db,'reseaux_sociaux/r_'+Date.now()),{nom,type,handle,lien,actif:true});
  document.getElementById('g-nom').value=''; document.getElementById('g-handle').value=''; document.getElementById('g-lien').value='';
  showToast('✅ Réseau ajouté !');
};

window.toggleGroupe = async function(key,makeActive){ await update(ref(db,'reseaux_sociaux/'+key),{actif:makeActive}); showToast(makeActive?'👁️ Affiché':'🙈 Masqué'); };
window.deleteGroupe = async function(key){ if(!confirm('Supprimer ?')) return; await remove(ref(db,'reseaux_sociaux/'+key)); showToast('🗑️ Supprimé'); };

// ── AVIS ──
function renderAvis(c){
  c.innerHTML=`
    <div style="display:flex;gap:.5rem;margin-bottom:.8rem">
      <button onclick="window.filterAvisAdmin('en attente',this)" id="btn-av-att" style="background:var(--red);color:#fff;border:none;padding:.4rem .9rem;border-radius:6px;cursor:pointer;font-size:.78rem;font-weight:700;font-family:'Barlow Condensed',sans-serif">⏳ En attente</button>
      <button onclick="window.filterAvisAdmin('validé',this)" id="btn-av-val" style="background:#333;color:#ccc;border:none;padding:.4rem .9rem;border-radius:6px;cursor:pointer;font-size:.78rem;font-weight:700;font-family:'Barlow Condensed',sans-serif">✅ Validés</button>
    </div>
    <div id="avis-admin-list"><div style="color:#aaa;font-size:.8rem;text-align:center;padding:1rem">Chargement...</div></div>`;
  window._avisFilter='en attente';
  loadAvisContent();
}

function loadAvisContent(){
  onValue(ref(db,'avis'),snap=>{
    const list=document.getElementById('avis-admin-list'); if(!list) return;
    const all=[];
    if(snap.exists()) snap.forEach(c=>all.push({id:c.key,...c.val()}));
    const filtered=all.filter(a=>a.statut===window._avisFilter);
    if(!filtered.length){ list.innerHTML=`<div class="empty-admin"><div class="ei">⭐</div>Aucun avis ${window._avisFilter}</div>`; return; }
    list.innerHTML=filtered.map(a=>`
      <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.85rem;margin-bottom:.55rem">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.3rem">
          <div style="font-weight:700;font-size:.85rem">👤 ${a.nom} — <span style="color:#f5c518">${'⭐'.repeat(a.note||0)}</span></div>
          <div style="font-size:.7rem;color:#555">${a.jeu}</div>
        </div>
        <div style="font-size:.8rem;color:#ccc;margin-bottom:.6rem">${a.texte}</div>
        <div style="display:flex;gap:.5rem">
          ${a.statut==='en attente'?`<button onclick="window.validerAvis('${a.id}')" style="background:#25d366;color:#fff;border:none;padding:.35rem .8rem;border-radius:5px;cursor:pointer;font-size:.75rem;font-weight:700">✅ Valider</button>`:'<span style="color:#25d366;font-size:.75rem;font-weight:700">✅ Validé</span>'}
          <button onclick="window.supprimerAvis('${a.id}')" style="background:#e02020;color:#fff;border:none;padding:.35rem .8rem;border-radius:5px;cursor:pointer;font-size:.75rem;font-weight:700">🗑️ Supprimer</button>
        </div>
      </div>`).join('');
  });
}

window.filterAvisAdmin = function(f,btn){
  window._avisFilter=f;
  document.getElementById('btn-av-att').style.background=f==='en attente'?'var(--red)':'#333';
  document.getElementById('btn-av-att').style.color=f==='en attente'?'#fff':'#ccc';
  document.getElementById('btn-av-val').style.background=f==='validé'?'#25d366':'#333';
  document.getElementById('btn-av-val').style.color=f==='validé'?'#fff':'#ccc';
  loadAvisContent();
};

window.validerAvis = async function(id){ await update(ref(db,'avis/'+id),{statut:'validé'}); showToast('✅ Avis validé !'); };
window.supprimerAvis = async function(id){ if(!confirm('Supprimer ?')) return; await remove(ref(db,'avis/'+id)); showToast('🗑️ Avis supprimé'); };

// ── NOTIFICATION ──
async function sendNotification(userKey,orderName,newStatus){
  const snap=await get(ref(db,'users/'+userKey)); if(!snap.exists()) return;
  const user=snap.val();
  const notifs=user.notifications?Object.values(user.notifications):[];
  const now=new Date();
  const mois=['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'];
  const dateStr=now.getDate()+' '+mois[now.getMonth()]+' '+now.getFullYear()+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  let msg='',icon='';
  if(newStatus==='delivered'){msg='✅ Votre commande "'+orderName+'" a été livrée !';icon='✅';}
  else if(newStatus==='cancelled'){msg='❌ Votre commande "'+orderName+'" a été annulée.';icon='❌';}
  else return;
  notifs.unshift({title:icon+' Commande mise à jour',desc:msg,date:dateStr,read:false});
  await update(ref(db,'users/'+userKey),{notifications:notifs});
}

function showToast(msg,type='success'){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast '+type+' show';
  setTimeout(()=>t.classList.remove('show'),2500);
}

document.documentElement.setAttribute('data-theme','dark');
</script>
